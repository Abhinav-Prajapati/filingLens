; llama.cpp router presets (docker-compose.yml, service "llm"). One server on :8081 serves all
; three; the "model" field of each request picks one. Models are read from ~/models (mounted at
; /models), never baked into an image. Section names are the model names the app sends.
;
;   qwen2.5-7b    chat: question understanding and written answers. GPU (llama.cpp fits as
;                 many layers as VRAM allows, the rest on the CPU). Loaded at start.
;   bge-m3-cpu    question embeddings for semantic search. CPU only, so it never takes VRAM
;                 from the chat model. Loaded at start; ~50 ms per question.
;   bge-m3-gpu    bulk embedding of annual reports (Admin -> Data -> Embed, "GPU"). The app
;                 unloads qwen2.5-7b first and reloads it afterwards (4 GB of VRAM holds one).
;
; BGE-M3 needs CLS pooling; the converted GGUF has no default, so it must be set here.

[qwen2.5-7b]
model           = /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
; one slot: the ~3.7k-token system prompt stays cached between questions (with several slots
; each request may land on a cold one and process it again, ~7 s); room for it plus the answer
parallel        = 1
ctx-size        = 8192
jinja           = true
load-on-startup = true

[bge-m3-cpu]
model           = /models/bge-m3-Q8_0.gguf
embedding       = true
pooling         = cls
n-gpu-layers    = 0
ctx-size        = 8192
batch-size      = 8192
ubatch-size     = 8192
load-on-startup = true

[bge-m3-gpu]
model           = /models/bge-m3-Q8_0.gguf
embedding       = true
pooling         = cls
n-gpu-layers    = 99
ctx-size        = 8192
batch-size      = 8192
ubatch-size     = 8192

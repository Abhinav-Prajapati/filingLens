[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filingLens"
version = "0.1.0"
description = "India Equity Research filingLens"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filingLens = ["domain/*.yaml", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["llm: live LLM tests (excluded from CI)"]

[tool.ruff]
line-length = 100

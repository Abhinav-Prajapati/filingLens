[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filingLens"
version = "0.1.0"
description = "India Equity Research filingLens"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pandas",
    "lxml>=6.1.3",
    "pymupdf>=2.1",
    "requests>=2.34.2",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[project.scripts]
filinglens = "filingLens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]
embed = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]
llm = [
    "openai>=3.50.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastapi-users[sqlalchemy]>=15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filingLens = ["domain/*.yaml", "storage/*.sql", "llm/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: live LLM tests (excluded from CI)",
    "embed: needs the real embedding model; run with `pytest -m embed`",
]
addopts = '-m "not embed and not llm"'


[tool.ruff]
line-length = 100

[tool.ruff.lint]
# N999: the package is named filingLens on purpose; SIM905: word lists read best as "a b c".split()
extend-ignore = ["N999", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["lxml.*", "pandas.*", "yaml.*", "sentence_transformers.*", "uvicorn.*", "boto3.*",
          "botocore.*"]
ignore_missing_imports = true

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: filinglens
          POSTGRES_PASSWORD: filinglens
          POSTGRES_DB: filinglens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filinglens" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      # each test gets its own schema in this database (tests/conftest.py)
      FILINGLENS_TEST_DATABASE_URL: postgresql://filinglens:filinglens@localhost:5432/filinglens_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # no embed extra (torch is large) and no LLM: tests use a fake LLM and hash embeddings
      - run: uv sync --extra dev --extra api --extra llm
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build

# Evaluation set for `filinglens eval`. Expected values come from the ingested data
# (TCS + INFY: FY23-FY26 with annual reports; HINDUNILVR: FY23-FY24; WIPRO: registered, no data).
# Re-check them when the data changes.
#
# expect:
#   tool:   name, or a list of acceptable tools
#   args:   subset of the normalised arguments; or a list of such dicts (any may match).
#           Scalars: equal, or one of a list. List arguments (tickers, metrics, fys): same set.
#   values: numbers that must appear in the result table (rounded to the given decimals)
#   pages:  the result must cite at least one of these pages (of `ticker`, when given)
#   answer_contains: strings the written answer must contain (LLM only)
#   refuse: true  -> must ask the user / say the company is not covered
#   no_value: true -> must return no number (data missing) instead of inventing one
# Questions are deliberately different from src/filingLens/llm/examples.yaml.

# ---------- single values ---------------------------------------------------------------------
- id: v01
  q: What was TCS revenue in FY25?
  tags: [value, en]
  expect: {tool: get_value, args: {ticker: TCS, metric: revenue_from_operations, fy: FY25}, values: [255324]}
- id: v02
  q: Infosys net profit for 2025-26
  tags: [value, en]
  expect: {tool: get_value, args: {ticker: INFY, metric: net_profit, fy: FY26}, values: [29474]}
- id: v03
  q: HUL revenue in FY23

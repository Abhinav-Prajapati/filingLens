  expect: {tool: get_value, args: {ticker: HINDUNILVR, metric: revenue_from_operations, fy: FY23}, values: [60580]}
- id: v04
  q: What is the latest EPS of TCS?
  tags: [value, en]
  expect: {tool: get_value, args: {ticker: TCS, metric: eps_basic, fy: [latest, FY26]}, values: [136.01]}
- id: v05
  q: TCS total assets at the end of FY26
  tags: [value, en, balance_sheet]
  expect: {tool: get_value, args: {ticker: TCS, metric: total_assets, fy: FY26}, values: [182372]}
